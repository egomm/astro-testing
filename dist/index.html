<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Solar System Orbit Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Courier New',monospace;color:#cfd8e3;}
  #canvas-holder{position:fixed;inset:0;}
  .panel{position:fixed;background:rgba(8,12,20,0.85);border:1px solid #2a3a52;border-radius:6px;padding:10px 14px;backdrop-filter:blur(4px);}
  #title-panel{top:14px;left:14px;}
  #title-panel .t1{color:#e8eef7;font-weight:bold;font-size:14px;letter-spacing:1px;}
  #title-panel .t2{color:#6b7c93;font-size:10px;margin-top:2px;}
  #date-panel{top:14px;right:14px;text-align:right;min-width:200px;}
  #date-panel .d1{color:#f2a13e;font-size:20px;font-weight:bold;}
  #date-panel .d2{color:#6b7c93;font-size:10px;margin-top:2px;}
  #view-panel{bottom:110px;left:14px;font-size:11px;}
  #view-panel .vt{color:#e8eef7;font-weight:bold;margin-bottom:6px;font-size:11px;}
  #view-panel button{background:#111a28;color:#cfd8e3;border:1px solid #2a3a52;border-radius:4px;padding:4px 10px;font-family:inherit;font-size:11px;cursor:pointer;margin-right:4px;}
  #view-panel button:hover{background:#1c2a3f;}
  #view-panel label{display:flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer;font-size:11px;}
  #hint{position:fixed;bottom:78px;left:0;right:0;text-align:center;color:#4a5a70;font-size:11px;letter-spacing:1px;}
  #controls{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 16px;}
  #controls button{background:#111a28;color:#cfd8e3;border:1px solid #2a3a52;border-radius:4px;width:34px;height:30px;font-family:inherit;cursor:pointer;font-size:13px;}
  #controls button.active{background:#4a2f14;border-color:#f2a13e;color:#f2a13e;}
  #controls button:hover{background:#1c2a3f;}
  #controls select{background:#111a28;color:#cfd8e3;border:1px solid #2a3a52;border-radius:4px;padding:6px;font-family:inherit;font-size:11px;}
  #controls input[type=range]{width:110px;accent-color:#f2a13e;}
  #controls input[type=date]{background:#111a28;color:#cfd8e3;border:1px solid #2a3a52;border-radius:4px;padding:5px;font-family:inherit;font-size:11px;}
  #controls .lbl{font-size:9px;color:#6b7c93;letter-spacing:1px;margin-bottom:2px;}
  #controls .grp{display:flex;flex-direction:column;align-items:flex-start;}
  #speedval{font-size:11px;color:#f2a13e;min-width:48px;}
  .planet-label{position:absolute;color:#cfd8e3;font-size:11px;pointer-events:none;transform:translate(6px,-6px);white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000;}
  #info-panel{position:fixed;top:80px;right:14px;width:230px;display:none;}
  #info-panel h3{margin:0 0 6px 0;color:#f2a13e;font-size:14px;}
  #info-panel .row{display:flex;justify-content:space-between;font-size:11px;margin:3px 0;color:#9fb0c3;}
  #info-panel .row b{color:#e8eef7;font-weight:normal;}
  #info-panel .close{position:absolute;top:8px;right:10px;cursor:pointer;color:#6b7c93;}
</style>
</head>
<body>
<div id="startup-overlay" style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:#9fb0c3;font-family:'Courier New',monospace;font-size:13px;z-index:10000;letter-spacing:1px;">
  starting orbit-server&hellip;
</div>
<div id="canvas-holder"></div>

<div class="panel" id="title-panel">
  <div class="t1">ORBIT VIEWER</div>
  <div class="t2">real N-body gravity / REBOUND (local)</div>
</div>

<div class="panel" id="date-panel">
  <div class="d1" id="dateBig">-</div>
  <div class="d2" id="dateJD">-</div>
</div>

<div class="panel" id="view-panel">
  <div class="vt">VIEW</div>
  <button id="resetBtn">reset</button>
  <button id="topBtn">top</button>
  <label><input type="checkbox" id="labelsChk" checked> labels</label>
  <label><input type="checkbox" id="orbitsChk" checked> orbit paths</label>
</div>

<div id="hint">drag to orbit &nbsp;/&nbsp; scroll to zoom &nbsp;/&nbsp; click a planet for details</div>

<div class="panel" id="controls">
  <button id="backBtn" title="step back">&#9664;</button>
  <button id="playBtn" title="play/pause" class="active">&#10074;&#10074;</button>
  <button id="fwdBtn" title="step forward">&#9654;</button>
  <select id="stepUnit">
    <option value="day">day</option>
    <option value="week" selected>week</option>
    <option value="month">month</option>
    <option value="year">year</option>
  </select>
  <div class="grp">
    <div class="lbl">SPEED (DAYS/SEC)</div>
    <input type="range" id="speedSlider" min="0" max="200" value="14" step="1">
  </div>
  <div id="speedval">1.4 d/s</div>
  <div class="grp">
    <div class="lbl">DATE</div>
    <input type="date" id="dateInput">
  </div>
  <button id="todayBtn">today</button>
</div>

<div id="labels-layer"></div>

<div class="panel" id="info-panel">
  <span class="close" id="infoClose">&times;</span>
  <h3 id="infoName">-</h3>
  <div class="row"><span>Distance from Sun</span><b id="infoDist">-</b></div>
  <div class="row"><span>Orbital period</span><b id="infoPeriod">-</b></div>
  <div class="row"><span>Eccentricity</span><b id="infoEcc">-</b></div>
  <div class="row"><span>Inclination</span><b id="infoInc">-</b></div>
</div>

<script>
// ---------- Planet catalogue ----------
// Positions come from a local Python server (Flask + REBOUND) spawned by
// Tauri as a sidecar - real gravitational N-body integration, not just an
// analytic ephemeris curve. See sidecar/server.py.
// period(days) is used for the info panel and orbit-line request; e/i are
// standard reference values shown in the info panel only.
const SERVER = "http://127.0.0.1:51733";
const PLANETS = [
 {name:"Mercury", period:87.9691,   color:0x9a9a9a, size:0.11,  real:2439,  e:0.2056, i:7.00},
 {name:"Venus",   period:224.701,   color:0xe0c27a, size:0.20,  real:6052,  e:0.0068, i:3.39},
 {name:"Earth",   period:365.256,   color:0x4a90d9, size:0.21,  real:6371,  e:0.0167, i:0.00},
 {name:"Mars",    period:686.980,   color:0xc1440e, size:0.16,  real:3390,  e:0.0934, i:1.85},
 {name:"Jupiter", period:4332.589,  color:0xd8ae82, size:0.68,  real:69911, e:0.0484, i:1.30},
 {name:"Saturn",  period:10759.22,  color:0xe3d19c, size:0.60,  real:58232, e:0.0539, i:2.49, hasRing:true},
 {name:"Uranus",  period:30685.4,   color:0x9fe3e8, size:0.40,  real:25362, e:0.0473, i:0.77},
 {name:"Neptune", period:60189.0,   color:0x4d6fe0, size:0.39,  real:24622, e:0.0086, i:1.77},
];
const AU = 22; // scene units per AU (compression happens via sqrt below for visibility)
function scaleDist(a){ return Math.sqrt(a) * AU * 0.72; } // compress outer orbits so all fit reasonably

function julianDate(date){
  return date.getTime()/86400000 + 2440587.5;
}

// Cache of the most recently fetched heliocentric AU position per planet,
// updated by a throttled background fetch loop rather than once per
// rendered frame (an HTTP round trip + N-body integration per animation
// frame would be far too slow/chatty).
const latestPositions = {}; // name -> {x,y,z,r}
let fetchInFlight = false;
let fetchSeq = 0;

async function waitForServer(maxTries=40){
  for(let i=0;i<maxTries;i++){
    try{
      const res = await fetch(SERVER+"/health");
      if(res.ok) return true;
    }catch(e){ /* server not up yet - keep retrying */ }
    await new Promise(r=>setTimeout(r, 250));
  }
  return false;
}

function toSceneCoords(pos){
  // pos: {x,y,z} heliocentric AU (ecliptic). Converts to this app's scene
  // units/orientation (same transform used everywhere else in this file).
  const r = Math.sqrt(pos.x*pos.x + pos.y*pos.y + pos.z*pos.z);
  const d = scaleDist(r);
  const ang = Math.atan2(pos.y, pos.x);
  const horiz = Math.sqrt(pos.x*pos.x + pos.y*pos.y) || 1e-9;
  return {
    x: d*Math.cos(ang),
    y: pos.z*(d/horiz),
    z: d*Math.sin(ang),
    r
  };
}

async function fetchPositions(jd){
  const mySeq = ++fetchSeq;
  try{
    const res = await fetch(`${SERVER}/positions?jd=${jd}`);
    const data = await res.json();
    if(mySeq !== fetchSeq) return; // a newer request has since superseded this one
    for(const name in data){ latestPositions[name] = data[name]; }
  }catch(e){ /* transient - next throttled tick will retry */ }
}

// ---------- Three.js scene ----------
const holder = document.getElementById('canvas-holder');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.01, 5000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
holder.appendChild(renderer.domElement);

// stars
function makeStars(){
  const geo = new THREE.BufferGeometry();
  const N = 3000, pts=[];
  for(let i=0;i<N;i++){
    const r = 900 + Math.random()*1200;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pts.push(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph));
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  const mat = new THREE.PointsMaterial({color:0xaabbcc, size:1.1, sizeAttenuation:false});
  scene.add(new THREE.Points(geo, mat));
}
makeStars();

// sun
const sunGeo = new THREE.SphereGeometry(0.9, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({color:0xfff3c4});
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
scene.add(sunMesh);
const sunLight = new THREE.PointLight(0xfff3c4, 2, 0, 0);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x404040, 1.2));
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (function(){
    const c=document.createElement('canvas'); c.width=c.height=128;
    const g=c.getContext('2d');
    const grad=g.createRadialGradient(64,64,0,64,64,64);
    grad.addColorStop(0,'rgba(255,240,200,0.9)');
    grad.addColorStop(1,'rgba(255,240,200,0)');
    g.fillStyle=grad; g.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  })(), transparent:true, depthWrite:false
}));
sunGlow.scale.set(4,4,1);
scene.add(sunGlow);

// orbit paths - drawn from points the server precomputed once via REBOUND
// (see buildScene() below, which fetches /orbit-paths and calls this).
const orbitLines = [];
function buildOrbitLine(p, samples){
  const pts = samples.map(pos=>{
    const s = toSceneCoords(pos);
    return new THREE.Vector3(s.x, s.y, s.z);
  });
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({color:0x3a4a63, transparent:true, opacity:0.7});
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  orbitLines.push(line);
}

// planet meshes
const planetMeshes = [];
PLANETS.forEach(p=>{
  const geo = new THREE.SphereGeometry(p.size, 24, 24);
  const mat = new THREE.MeshStandardMaterial({color:p.color, roughness:0.8, metalness:0.1});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData = {planet:p};
  scene.add(mesh);
  if(p.hasRing){
    const ringGeo = new THREE.RingGeometry(p.size*1.4, p.size*2.2, 48);
    const ringMat = new THREE.MeshBasicMaterial({color:0xcbb783, side:THREE.DoubleSide, transparent:true, opacity:0.7});
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2 - 0.4;
    mesh.add(ring);
  }
  planetMeshes.push(mesh);
});

// labels (DOM overlay)
const labelsLayer = document.getElementById('labels-layer');
const labelEls = {};
PLANETS.forEach(p=>{
  const el = document.createElement('div');
  el.className = 'planet-label';
  el.textContent = p.name;
  labelsLayer.appendChild(el);
  labelEls[p.name] = el;
});

// camera / orbit controls (manual, no external addon needed)
let camDist = 60, camTheta = Math.PI*0.32, camPhi = Math.PI*0.38, camTarget = new THREE.Vector3(0,0,0);
function updateCamera(){
  const x = camDist*Math.sin(camPhi)*Math.cos(camTheta);
  const y = camDist*Math.cos(camPhi);
  const z = camDist*Math.sin(camPhi)*Math.sin(camTheta);
  camera.position.set(x,y,z).add(camTarget);
  camera.lookAt(camTarget);
  // Vector3.project() uses camera.matrixWorldInverse, which THREE only
  // recomputes on updateMatrixWorld(). Without this call it stays one
  // frame stale during a drag, which is what made the labels visibly
  // lag behind the planets while orbiting the camera.
  camera.updateMatrixWorld(true);
}
updateCamera();

let dragging=false, lastX=0, lastY=0;
renderer.domElement.addEventListener('mousedown', e=>{dragging=true; lastX=e.clientX; lastY=e.clientY;});
window.addEventListener('mouseup', ()=>dragging=false);
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  camTheta -= dx*0.005;
  camPhi = Math.min(Math.PI-0.05, Math.max(0.05, camPhi - dy*0.005));
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e=>{
  camDist *= (1 + Math.sign(e.deltaY)*0.1);
  camDist = Math.min(500, Math.max(3, camDist));
  updateCamera();
}, {passive:true});

document.getElementById('resetBtn').onclick = ()=>{ camDist=60; camTheta=Math.PI*0.32; camPhi=Math.PI*0.38; camTarget.set(0,0,0); updateCamera(); };
document.getElementById('topBtn').onclick = ()=>{ camPhi = 0.15; updateCamera(); };

// click to select planet
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const infoPanel = document.getElementById('info-panel');
document.getElementById('infoClose').onclick = ()=> infoPanel.style.display='none';
renderer.domElement.addEventListener('click', e=>{
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(planetMeshes);
  if(hits.length){
    const p = hits[0].object.userData.planet;
    showInfo(p);
  }
});
function showInfo(p){
  const pos = latestPositions[p.name];
  infoPanel.style.display='block';
  document.getElementById('infoName').textContent = p.name;
  document.getElementById('infoDist').textContent = pos ? Math.sqrt(pos.x*pos.x+pos.y*pos.y+pos.z*pos.z).toFixed(3)+' AU' : '-';
  document.getElementById('infoPeriod').textContent = (p.period/365.25).toFixed(2)+' yr';
  document.getElementById('infoEcc').textContent = p.e.toFixed(4);
  document.getElementById('infoInc').textContent = p.i.toFixed(2)+'\u00B0';
}

// ---------- time control ----------
let currentJD = julianDate(new Date());
let playing = true;
let speedDaysPerSec = 1.4;
const dateBig = document.getElementById('dateBig');
const dateJDel = document.getElementById('dateJD');
const dateInput = document.getElementById('dateInput');
const speedSlider = document.getElementById('speedSlider');
const speedval = document.getElementById('speedval');
const playBtn = document.getElementById('playBtn');
const stepUnit = document.getElementById('stepUnit');

function jdToDate(jd){ return new Date((jd-2440587.5)*86400000); }
function fmtDate(d){
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return months[d.getUTCMonth()]+" "+d.getUTCDate()+", "+d.getUTCFullYear();
}
function fmtInputDate(d){
  const mm=String(d.getUTCMonth()+1).padStart(2,'0'), dd=String(d.getUTCDate()).padStart(2,'0');
  return d.getUTCFullYear()+"-"+mm+"-"+dd;
}
function updateDateUI(){
  const d = jdToDate(currentJD);
  dateBig.textContent = fmtDate(d);
  dateJDel.textContent = "JD "+currentJD.toFixed(2);
  dateInput.value = fmtInputDate(d);
}

speedSlider.addEventListener('input', ()=>{
  speedDaysPerSec = Math.pow(speedSlider.value/200, 2)*400; // nonlinear for finer low-end control
  if(speedSlider.value==0) speedDaysPerSec=0;
  speedval.textContent = speedDaysPerSec.toFixed(1)+" d/s";
});
speedSlider.dispatchEvent(new Event('input'));

playBtn.onclick = ()=>{
  playing = !playing;
  playBtn.classList.toggle('active', playing);
  playBtn.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
};
function stepAmount(){
  switch(stepUnit.value){
    case 'day': return 1;
    case 'week': return 7;
    case 'month': return 30.44;
    case 'year': return 365.25;
  }
}
document.getElementById('fwdBtn').onclick = ()=>{ currentJD += stepAmount(); updateDateUI(); };
document.getElementById('backBtn').onclick = ()=>{ currentJD -= stepAmount(); updateDateUI(); };
document.getElementById('todayBtn').onclick = ()=>{ currentJD = julianDate(new Date()); updateDateUI(); };
dateInput.addEventListener('change', ()=>{
  const parts = dateInput.value.split('-').map(Number);
  const d = new Date(Date.UTC(parts[0], parts[1]-1, parts[2]));
  currentJD = julianDate(d);
  updateDateUI();
});
document.getElementById('labelsChk').onchange = e=>{
  labelsLayer.style.display = e.target.checked ? '' : 'none';
};
document.getElementById('orbitsChk').onchange = e=>{
  orbitLines.forEach(l=> l.visible = e.target.checked);
};

updateDateUI();

// ---------- animation loop ----------
let lastT = performance.now();
let lastFetchT = 0;
const FETCH_INTERVAL_MS = 150; // throttle: don't hit the server every rendered frame

function animate(now){
  requestAnimationFrame(animate);
  const dt = (now-lastT)/1000; lastT = now;
  if(playing) currentJD += speedDaysPerSec*dt;
  updateDateUI();

  if(!fetchInFlight && now - lastFetchT > FETCH_INTERVAL_MS){
    lastFetchT = now;
    fetchInFlight = true;
    fetchPositions(currentJD).finally(()=>{ fetchInFlight = false; });
  }

  PLANETS.forEach((p, idx)=>{
    const pos = latestPositions[p.name];
    if(!pos) return; // no data yet (first frame or two while the initial fetch is in flight)
    const s = toSceneCoords(pos);
    const mesh = planetMeshes[idx];
    mesh.position.set(s.x, s.y, s.z);
    mesh.rotation.y += 0.01;

    // project to screen for label
    const v = mesh.position.clone().project(camera);
    const sxp = (v.x*0.5+0.5)*window.innerWidth;
    const syp = (-v.y*0.5+0.5)*window.innerHeight;
    const el = labelEls[p.name];
    if(v.z < 1){
      el.style.display='block';
      el.style.left = sxp+'px';
      el.style.top = syp+'px';
    } else {
      el.style.display='none';
    }
  });

  renderer.render(scene, camera);
}

// ---------- startup: wait for the sidecar, load orbit paths + first positions ----------
const startupOverlay = document.getElementById('startup-overlay');
(async function init(){
  const ready = await waitForServer();
  if(!ready){
    startupOverlay.textContent = "Could not reach the local orbit-server (127.0.0.1:51733). It may have failed to start - check the app's logs.";
    startupOverlay.style.color = '#e88';
    startupOverlay.style.padding = '40px';
    startupOverlay.style.textAlign = 'center';
    return;
  }
  try{
    const res = await fetch(SERVER+"/orbit-paths");
    const paths = await res.json();
    PLANETS.forEach(p=> buildOrbitLine(p, paths[p.name]));
  }catch(e){
    console.error("failed to load orbit paths", e);
  }
  await fetchPositions(currentJD);
  startupOverlay.style.display = 'none';
  requestAnimationFrame(animate);
})();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

name: build

# Runs whenever you push a tag like "v0.1.0", or manually via the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed so the built-in GITHUB_TOKEN is allowed to create/update the
# GitHub Release. Without this, some repos default to read-only and the
# release step fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest runners are Apple Silicon; this builds a native
          # aarch64 app only (no universal Intel+ARM binary - PyInstaller
          # can't easily produce that for a bundled Python without a much
          # more involved cross-build setup, so it's left out of this
          # feasibility build).
          - platform: "macos-latest"
            rust_target: "aarch64-apple-darwin"
            py_arch: "arm64"
          - platform: "ubuntu-22.04"
            rust_target: "x86_64-unknown-linux-gnu"
            py_arch: "x64"
          - platform: "windows-latest"
            rust_target: "x86_64-pc-windows-msvc"
            py_arch: "x64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.py_arch }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Python dependencies
        run: pip install -r sidecar/requirements.txt

      - name: Freeze the REBOUND/Flask sidecar with PyInstaller
        shell: bash
        run: |
          # REBOUND's C core isn't inside the `rebound` package folder - setup.py
          # installs it as a separate top-level extension module (librebound.*.so /
          # .pyd / .dylib) next to the package, and rebound/__init__.py locates it
          # at import time with a hand-built ctypes path
          # (os.path.dirname(__file__) + "/../librebound" + suffix). PyInstaller's
          # static analysis can't follow that hand-built string, and the file also
          # lives outside the `rebound/` tree, so `--collect-all rebound` - which
          # only walks the package folder itself - never picks it up. That's why
          # the frozen exe still throws "librebound not found" even with
          # --collect-all rebound in place.
          #
          # Fix: locate the actual compiled file and hand it to PyInstaller
          # explicitly via --add-binary, dropped at the bundle root so the
          # "../librebound<suffix>" lookup resolves the same way it does in a
          # normal install.
          LIBREBOUND=$(python -c "import glob, os, rebound; d = os.path.dirname(rebound.__file__); matches = glob.glob(os.path.join(d, '..', 'librebound*')); print(matches[0]) if matches else exit('Could not locate the compiled librebound extension next to ' + d)")
          echo "Found librebound at: $LIBREBOUND"

          SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"
          fi

          pyinstaller --onefile --name orbit-server --collect-all rebound \
            --add-binary "${LIBREBOUND}${SEP}." \
            --distpath sidecar/dist sidecar/server.py

      - name: Install sidecar binary into src-tauri/binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp sidecar/dist/orbit-server.exe "src-tauri/binaries/orbit-server-${{ matrix.rust_target }}.exe"

      - name: Install sidecar binary into src-tauri/binaries (macOS/Linux)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p src-tauri/binaries
          cp sidecar/dist/orbit-server "src-tauri/binaries/orbit-server-${{ matrix.rust_target }}"
          chmod +x "src-tauri/binaries/orbit-server-${{ matrix.rust_target }}"

      - name: Install npm dependencies
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Solar System Orbit Viewer ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }}
